name: Gradle CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java ${{ matrix.java-version }})
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}
      - name: Make Gradle wrappers executable
        run: chmod +x gradlew vscode-extension/gradlew
      - name: Build language server with Gradle
        run: ./gradlew clean build
      - name: Build VSCode extension with Gradle
        working-directory: vscode-extension
        run: ./gradlew clean build
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.java-version == '17' }}
        with:
          name: groovy-language-server
          path: build/libs/groovy-language-server-all.jar
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.java-version == '17' }}
        with:
          name: vscode-extension
          path: vscode-extension/build/groovy-*.vsix
          archive: false
          if-no-files-found: error

      # Publishing runs only for version tags (e.g. v1.0.0), so ordinary
      # branch pushes and pull requests never touch the releases page.
      - name: Collect release assets
        if: ${{ matrix.java-version == '17' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p release-assets
          cp build/libs/groovy-language-server-all.jar release-assets/
          cp vscode-extension/build/*.vsix release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        if: ${{ matrix.java-version == '17' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating its assets."
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
